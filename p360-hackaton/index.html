<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paciente 360 - Hackaton</title>

  <!--
    Backend URL exposed to the app. Vite substitutes
    `%VITE_HACKATON_API_URL%` at build time from the project env file.
  -->
  <meta name="p360-api-url" content="%VITE_HACKATON_API_URL%">

  <!--
    Este embed roda dentro de um iframe de terceiro relativo ao host
    legado (avp-empresas). Persistimos o `?accessToken=` em
    sessionStorage assim que a página carrega, antes do bundle React
    montar, porque navegadores modernos (Chrome 113+, Brave, Safari)
    bloqueiam escrita de cookie de terceiro por padrão — o que
    silenciosamente derrubaria o token e quebraria todo header
    `X-Access-Token`. sessionStorage é particionado por origem do
    iframe e não sofre esse bloqueio.
  -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(location.search);
        var accessToken = params.get('accessToken');
        if (accessToken && accessToken.trim() !== '') {
          try { sessionStorage.setItem('p360_access_token', accessToken); } catch (_) {}
        }
      } catch (_) {
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
